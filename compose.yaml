name: artstyle
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    networks: [ingress, web]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=1777
      - /var/run:rw,nosuid,nodev,size=8m,mode=1777
      - /tmp:rw,nosuid,nodev,size=8m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: ./backend
      target: backend
    environment:
      DATABASE_URL: postgresql://artstyle_web:${APP_DB_PASSWORD:?Run tools/setup.py}@db:5432/artstyle
      APP_URL: ${APP_URL:?Run tools/setup.py}
      APP_USERNAME: ${APP_USERNAME:?Run tools/setup.py}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Run tools/setup.py}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENGINE_URL: http://runner:8001
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Run tools/setup.py}
      DATA_DIR: /data
    volumes:
      - images:/data
    networks: [web, database, engine]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    logging: *logging
  runner:
    profiles: [codex]
    build:
      context: ./backend
      target: runner
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Run tools/setup.py}
      CODEX_HOME: /home/app/.codex
    volumes:
      - codex:/home/app/.codex
      - codex-bin:/opt/codex
    networks: [engine, egress]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: artstyle
      POSTGRES_USER: artstyle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/setup.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run tools/setup.py}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artstyle -d artstyle"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
networks:
  ingress: {}
  web: {internal: true}
  database: {internal: true}
  engine: {internal: true}
  egress: {}
volumes:
  images:
  postgres:
  codex:
  codex-bin:
